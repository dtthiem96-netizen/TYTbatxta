[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

[dev]
  port = 8889
  publish = "public"
  framework = "#static"

# Đường dẫn gọn cho Bảng điều khiển Cán bộ Y tế Điểm trạm — trỏ về SPA root
[[redirects]]
  from = "/tram"
  to = "/"
  status = 200

[[redirects]]
  from = "/tram/*"
  to = "/"
  status = 200

# API mapping: chuyển /api/* sang Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = false

# Các tệp chỉ dùng cho máy chủ nội bộ không được xuất bản (khi publish = "public" chúng không nằm trong thư mục publish)
[[redirects]]
  from = "/telehealth.db"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/server.js"
  to = "/"
  status = 404
  force = true

# Fallback cho SPA (tất cả các đường dẫn trả về public/index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
