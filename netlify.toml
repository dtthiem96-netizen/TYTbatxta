[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

[dev]
  port = 8889
  publish = "public"
  framework = "#static"

[images]
  remote_images = ["https://.*"]

# Caching — Netlify CDN headers
[[headers]]
  for = "/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Đường dẫn gọn cho Bảng điều khiển Cán bộ Y tế Điểm trạm — trỏ về SPA root
[[redirects]]
  from = "/tram"
  to = "/"
  status = 200

[[redirects]]
  from = "/tram/*"
  to = "/"
  status = 200

# Đường dẫn cho Bảng điều khiển Quản trị Nội bộ Admin
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# API mapping: chuyển /api/* sang Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = false

# Các tệp chỉ dùng cho máy chủ nội bộ không được xuất bản (khi publish = "public" chúng không nằm trong thư mục publish)
[[redirects]]
  from = "/telehealth.db"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/server.js"
  to = "/"
  status = 404
  force = true

# Fallback cho SPA (tất cả các đường dẫn trả về public/index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
